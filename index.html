<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Controle financeiro pessoal offline">
<title>Overall Finanças</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<script>
/* Aplica o tema antes da primeira pintura (evita piscar). A preferência de
   tema é uma configuração simples — dados financeiros nunca vão para cá. */
(function () {
  try {
    var t = localStorage.getItem('overall_financas_tema') || 'dark';
    if (t === 'system') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#F5F5F5' : '#000000');
  } catch (e) {}
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-mark">O</div>
  <div class="boot-txt">Carregando…</div>
</div>

<div id="fatal" class="fatal" hidden>
  <div class="fatal-card">
    <div class="fatal-icon">!</div>
    <h2>Ocorreu um problema ao carregar esta informação.</h2>
    <p id="fatal-msg" class="muted"></p>
    <p class="muted small">Seus dados continuam salvos neste dispositivo. Nada foi apagado.</p>
    <div class="row gap">
      <button class="btn btn-primary" id="fatal-retry">Tentar novamente</button>
      <button class="btn btn-ghost" id="fatal-backup">Exportar backup</button>
    </div>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <button class="mnav-btn" id="month-prev" aria-label="Mês anterior">‹</button>
      <button class="month-pill" id="month-current" aria-label="Selecionar mês">
        <span id="month-label">—</span>
        <span class="month-caret">▾</span>
      </button>
      <button class="mnav-btn" id="month-next" aria-label="Próximo mês">›</button>
    </div>
    <div class="topbar-title" id="view-title">Início</div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <button id="fab" class="fab" aria-label="Adicionar lançamento">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>

  <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
</div>

<div id="lock" class="lock" hidden>
  <div class="lock-inner">
    <div class="boot-mark lock-mark">O</div>
    <h1 class="lock-title">Overall Finanças</h1>
    <p class="lock-sub" id="lock-sub">Digite seu PIN</p>
    <div class="pin-dots" id="pin-dots" role="status" aria-live="polite"></div>
    <div class="pin-error" id="pin-error" role="alert"></div>
    <div class="keypad" id="keypad"></div>
    <button class="btn btn-ghost bio-btn" id="bio-btn" hidden>Usar biometria</button>
  </div>
</div>

<div id="sheet-root"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

<noscript>
  <div class="fatal"><div class="fatal-card"><h2>Ative o JavaScript</h2><p>Este aplicativo precisa de JavaScript para funcionar.</p></div></div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
